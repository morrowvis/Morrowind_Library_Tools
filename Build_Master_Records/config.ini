[settings]

# (Blender's path lives in ..\Shared\paths.ini -- shared with the other Blender tools.)

# MO2 mode only: which plugins to process.
#   enabled = only the active load order (Morrowind.ini [Game Files]).
#   all     = every plugin MO2 lists (loadorder.txt), enabled or not.
plugins = enabled

# Mods to include even though they are NOT ticked in MO2's modlist -- one per
# indented line (or comma separated). A bare name is looked up under the
# instance's mods folder; an absolute path is used as-is. Their plugins are
# appended to the end of the load order, so their records win ties, and their
# folders are searched for meshes just above the ticked mods. Blank = none.
extra_mods =

# Filters -- which records to keep. Blank = no filter (keep everything).
#   name = a search term matched (case-insensitive) against each record's id, name,
#          mesh and source mod. Commas separate AND-terms; a term with * or ? is a
#          glob, otherwise a substring.  e.g.  light_torch   or   *_candle_*, Tamriel
#   type = comma-separated object types to keep.  e.g.  Light, Static, Misc Item
name =
type =

# Apply "Let There Be Darkness" light overrides (colour + radius) to light records,
# so they match what the game actually shows. auto = apply if the mod is enabled;
# false = never.
apply_ltbd = auto

# Parallel workers (tes3conv runs once per plugin). -1 = one per CPU core.
workers = -1

# Lay the records out in a grid instead of all stacked at the origin, so you can view
# them spread apart. 0 = stacked (default). A positive number is the fixed gap between
# records (in game units) -- they fill one continuous square-ish grid.
spacing = 0

# Output packaging:
#   single = one "master structure.json" file; objects are split into 1000-object
#            parts, each wrapped as {"json_name": ..., "objects": [...]}.
#   split  = one flat "master records part N.json" file per 1000-object part, each
#            just [ ...objects... ] with no wrapper.
output = single

# Whitespace of the output json (applies either way):
#   minified = single line, smallest file, fastest to load (what the pipeline uses).
#   pretty   = indented and multi-line, easier to read/diff by hand (larger file).
json_format = minified
