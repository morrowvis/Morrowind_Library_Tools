[settings]

# Top-level folders to compare, comma-separated.
subfolders = meshes, textures

# true  = treat same-size files as unchanged (faster, skips hashing)
# false = also hash same-size files so content edits are caught (slower, exact)
quick = false

# Parallel workers for hashing. -1 = one per CPU core.
workers = -1

# Outputs a flagged_meshes.txt listing.
flagged_meshes = true

# true = ignore meshes that belong only to creatures (matches how the mesh export
#        filters them out). Reads the .esp/.esm at the root of each library folder
#        with tes3conv to find which meshes are creature-only; a mesh any non-creature
#        record also uses is still compared. Needs Shared\tes3conv.exe.
# false = compare every mesh (default).
exclude_creatures = false
